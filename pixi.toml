[workspace]
channels = ["conda-forge","pytorch"]
name = "qnn"
platforms = ["win-arm64"]
version = "0.1.0"

[tasks]
check = "python scripts/check.py"
install-genai = "python scripts/install.py"
benchmark = "python benchmark.py"
context-sweep = "python scripts/context_sweep.py"
plot = "python plot.py"

[dependencies]
python = "3.14.*"

[pypi-dependencies]
# onnxruntime-genai is NOT managed by pixi - must be installed manually from source build:
#   pixi run pip install --force-reinstall --no-deps build/Windows/RelWithDebInfo/wheel/onnxruntime_genai-*.whl
pip = ">=26.0.1, <27"
requests = ">=2.33.1, <3"
onnxruntime = ">=1.24.4, <2"
onnxruntime-qnn = ">=2.0.0, <3"
huggingface-hub = ">=0.26.0"
matplotlib = ">=3.9"
